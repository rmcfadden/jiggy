[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["multipart"] }
base64 = "0.22"
bcrypt = "0.19.3"
datasources = "0.1.58"
datasources-mysql = "0.1.58"
datasources-postgres = "0.1.58"
datasources-sqlite = "0.1.58"
futures-util = "0.3.34"
hmac = "0.13"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp"] }
serde_json = "1.0.154"
sha2 = "0.11"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net"] }

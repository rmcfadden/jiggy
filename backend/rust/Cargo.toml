[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["multipart"] }
base64 = "0.22"
bcrypt = "0.19.3"
datasources = "0.1.65"
datasources-mysql = "0.1.65"
datasources-postgres = "0.1.65"
datasources-sqlite = "0.1.65"
futures-util = "0.3.34"
hmac = "0.13"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
sha2 = "0.11"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "sync"] }
uuid = { version = "1.29", features = ["v4"] }
unicode-normalization = "0.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "form", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls", "aws-lc-rs", "rustls-platform-verifier"] }

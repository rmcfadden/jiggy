version: 1.0.0
includes:
  - file: base.yaml

types:
  - languages:
      tags: [datasource_type, view_type]
      inherits: base
      fields:
        - code:
            # ISO 639-1 two-letter code, e.g. en, fr, de
            type: string
            size: 2
        - name:
            type: string
            size: 128
        - is_enabled:
            type: boolean
            default_value: true
        - is_deleted:
            type: boolean
            default_value: false

  - localized_string_name:
      tags: [datasource_type, view_type]
      inherits: base
      fields:
        - name:
            type: string
            size: 128
        - description:
            type: string
            size: unlimited

  - localized_string_base:
      tags: [datasource_type]
      inherits: base
      fields:
        - localized_string_name_id:
            references: localized_string_name.id
        - language_id:
            references: languages.id
        - value:
            type: string
            size: unlimited
        - is_enabled:
            type: boolean
            default_value: true
        - is_deleted:
            type: boolean
            default_value: false
  - localized_string:
      tags: [view_type]
      inherits: localized_string_base
      remove_fields:
        - localized_string_name_id
        - language_id
      union:
        - localized_string_name
        - languages
      extract:
        - localized_string_name.name
        - languages.name
      mapping:
        languages.name: language_name
  - mime_type:
      tags:
        - datasource_type
        - readonly_lookup
      inherits: base
      fields:
        - name:
            # e.g. application/json
            type: string
            size: 128
        - description:
            type: string
            size: unlimited
            default_value: ""
  - resource_base:
      tags: [datasource_type]
      inherits: base
      fields:
        - resource_name:
            type: string
            size: 128
        - mime_type_id:
            references: mime_type.id
        - description:
            type: string
            size: unlimited
        - location:
            type: string
            size: 256
        - is_enabled:
            type: boolean
            default_value: true
        - is_deleted:
            type: boolean
            default_value: false
  - resource:
      tags: [view_type]
      inherits: resource_base
      remove_fields:
        - mime_type_id
      union:
        - mime_type
      extract:
        - mime_type.name
      mapping:
        name: mime_type_name

  - template_type:
      tags: [datasource_type]
      inherits: base
      fields:
        - name:
            type: string
            size: 128
        - description:
            type: string
            size: unlimited
            default_value: ""
  - template_base:
      tags: [datasource_type]
      inherits: base
      fields:
        - template_type_id:
            references: template_type.id
        - name:
            type: string
            size: 128
        - content:
            # the template's settings as JSON
            type: string
            size: unlimited
  - template:
      tags: [view_type]
      inherits: template_base
      remove_fields:
        - template_type_id
      union:
        - template_type
      extract:
        - template_type.name
      mapping:
        template_type.name: template_type_name




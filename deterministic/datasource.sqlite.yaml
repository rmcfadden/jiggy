version: 1.0.0
includes:
  - types:
      filter: tag == "datasource_type"
types:
  - base:
      fields:
        - id:
            include_in_create: false
            include_in_update: false
        - uuid:
            include_in_create: true
        - created:
            include_in_create: true
        - updated:
            include_in_create: false
            include_in_update: false
        - version:
            include_in_create: true
  - user_base:
      mapping: users
  - user_setting:
      indexes:
        - user_setting_user_id_name:
            fields: [user_id, name]
            is_unique: true
  - game_parent_setting:
      indexes:
        - game_parent_setting_game_parent_id_name:
            fields: [game_parent_id, name]
            is_unique: true
  - game_setting:
      indexes:
        - game_setting_game_id_name:
            fields: [game_id, name]
            is_unique: true
  - game_base:
      mapping: games
  - game_parent_base:
      mapping: game_parent
  - localized_string_base:
      mapping: localized_string
  - resource_base:
      mapping: resource
  - game_category:
      indexes:
        - game_category_game_id_category_id:
            fields: [game_id, category_id]
            is_unique: true
  - game_parent_category:
      indexes:
        - game_parent_category_game_parent_id_category_id:
            fields: [game_parent_id, category_id]
            is_unique: true
  - email_base:
      mapping: email
      indexes:
        - email_base_contact_id_index:
            fields: [contact_id]
            is_unique: false
  - phone_base:
      mapping: phone
      indexes:
        - phone_base_contact_id_index:
            fields: [contact_id]
            is_unique: false
  - address_base:
      mapping: address
      indexes:
        - address_base_contact_id_index:
            fields: [contact_id]
            is_unique: false
  - contact_base:
      mapping: contact
  - template_base:
      mapping: templates
      indexes:
        - template_template_type_id_name:
            fields: [template_type_id, name]
            is_unique: true
  - contact_attribute:
      indexes:
        - contact_attribute_contact_id_index:
            fields: [contact_id]
            is_unique: false
  - address_attribute:
      indexes:
        - address_attribute_address_id_index:
            fields: [address_id]
            is_unique: false
  - contact_label:
      indexes:
        - contact_label_contact_id_label_id:
            fields: [contact_id, label_id]
            is_unique: true
        - contact_label_label_id_index:
            fields: [label_id]
            is_unique: false
  - address_label:
      indexes:
        - address_label_address_id_label_id:
            fields: [address_id, label_id]
            is_unique: true
  - email_label:
      indexes:
        - email_label_email_id_label_id:
            fields: [email_id, label_id]
            is_unique: true
  - phone_label:
      indexes:
        - phone_label_phone_id_label_id:
            fields: [phone_id, label_id]
            is_unique: true

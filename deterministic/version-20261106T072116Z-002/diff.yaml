datasource.yaml:
  types:
    added:
      - template_type:
          fields:
            - name:
                is_unique: true
      - template:
          indexes:
            - template_template_type_id_name:
                fields:
                  - template_type_id
                  - name
                is_unique: true
datasource_seeds.yaml:
  seeds:
    added:
      - template_type:
          - id1:
              name: jigsaw
              description: Jigsaw template settings
types.yaml:
  types:
    added:
      - template_type:
          tags:
            - datasource_type
            - readonly_lookup
          inherits: base
          fields:
            - name:
                type: string
                size: 128
            - description:
                type: string
                size: unlimited
                default_value: ""
      - template:
          tags:
            - datasource_type
          inherits: base
          fields:
            - template_type_id:
                references: template_type.id
            - name:
                type: string
                size: 128
            - content:
                type: string
                size: unlimited
applications.yaml:
  added: true
  content: null
puzzles.yaml:
  added: true
  content: null

version: 1.0.0
seeds:
  - oauth_grant_type:
      - id1:
          name: authorization_code
          description: The Authorization Code grant type lets confidential and public clients exchange an authorization code for an access token after the user is redirected back to the client.
      - id2:
          name: refresh_token
          description: The Refresh Token grant type lets clients exchange a refresh token for a new access token once the original has expired, allowing them to maintain valid access without requiring further user interaction.
      - id3:
          name: urn:ietf:params:oauth:grant-type:device_code
          description: The Device Code grant type enables browserless or input-constrained devices to exchange a previously obtained device code for an access token.
      - id4:
          name: client_credentials
          description: To authenticate this request, the client can either include client_id and client_secret as additional request parameters, or pass them via the HTTP Basic auth header.
      - id5:
          name: implicit
          description: The Implicit flow was a simplified OAuth flow previously recommended for native and JavaScript apps that returned an access token immediately, bypassing the authorization code exchange step.
          is_legacy: true
      - id6:
          name: password
          description: The Password grant type is a legacy method for exchanging a user's credentials directly for an access token. Since this requires the client to collect and transmit the user's password to the authorization server, it is no longer recommended.
          is_legacy: true
          
  - secret_type:
      - id1:
          name: password_argon2id
      - id2:
          name: password_bcrypt
      - id3:
          name: pin_argon2id
      - id4:
          name: pin_bcrypt

  - token_type:
      - id1:
          name: text
          description: Opaque text token
      - id2:
          name: guid
          description: GUID token
      - id3:
          name: jwt_access_token
          description: Short-lived JWT access token
      - id4:
          name: jwt_refresh_token
          description: Long-lived JWT refresh token
      - id5:
          name: signin_token
          description: Single-use signin token exchanged for access and refresh tokens
      - id6:
          name: email_confirmation
          description: Short-lived single-use code emailed to confirm an email address

  - identity_provider_type:
      - id1:
          name: oidc
          description: OpenID Connect provider (Google, Apple, Microsoft); identity comes from the id_token
      - id2:
          name: oauth2
          description: Plain OAuth 2.0 provider (Facebook, GitHub); identity comes from the userinfo endpoint

  - identity_provider_linked_user_field_type:
      - id1:
          name: subject
      - id2:
          name: email
      - id3:
          name: email_verified
      - id4:
          name: first_name
      - id5:
          name: last_name
      - id6:
          name: avatar_url

applications.yaml:
  added: true
  content: null
base.yaml:
  added: true
  content:
    version: 1.0.0
    types:
      - base:
          fields:
            - id:
                type: biginteger
                is_id: true
            - uuid:
                type: uuid
                default_value: NewId
            - created:
                type: datetime
                default_value: UtcNow
            - updated:
                type: datetime
                default_value: UtcNow
            - version:
                type: binary
                default_value: Hex('00')
cms.yaml:
  added: true
  content:
    version: 1.0.0
    includes:
      - file: base.yaml
    types:
      - languages:
          tags:
            - datasource_type
            - view_type
          inherits: base
          fields:
            - code:
                type: string
                size: 2
            - name:
                type: string
                size: 128
            - is_enabled:
                type: boolean
                default_value: true
            - is_deleted:
                type: boolean
                default_value: false
      - localized_string_name:
          tags:
            - datasource_type
            - view_type
          inherits: base
          fields:
            - name:
                type: string
                size: 128
            - description:
                type: string
                size: unlimited
      - localized_string_base:
          tags:
            - datasource_type
          inherits: base
          fields:
            - localized_string_name_id:
                references: localized_string_name.id
            - language_id:
                references: languages.id
            - value:
                type: string
                size: unlimited
            - is_enabled:
                type: boolean
                default_value: true
            - is_deleted:
                type: boolean
                default_value: false
      - localized_string:
          tags:
            - view_type
          inherits: localized_string_base
          remove_fields:
            - localized_string_name_id
            - language_id
          union:
            - localized_string_name
            - languages
          extract:
            - localized_string_name.name
            - languages.name
          mapping:
            languages.name: language_name
      - mime_type:
          tags:
            - datasource_type
            - readonly_lookup
          inherits: base
          fields:
            - name:
                type: string
                size: 128
            - description:
                type: string
                size: unlimited
                default_value: ""
      - resource_base:
          tags:
            - datasource_type
          inherits: base
          fields:
            - resource_name:
                type: string
                size: 128
            - mime_type_id:
                references: mime_type.id
            - description:
                type: string
                size: unlimited
            - location:
                type: string
                size: 256
            - is_enabled:
                type: boolean
                default_value: true
            - is_deleted:
                type: boolean
                default_value: false
      - resource:
          tags:
            - view_type
          inherits: resource_base
          remove_fields:
            - mime_type_id
          union:
            - mime_type
          extract:
            - mime_type.name
          mapping:
            name: mime_type_name
contacts.yaml:
  added: true
  content:
    version: 1.0.0
    includes:
      - file: base.yaml
    types:
      - gender:
          tags:
            - datasource_type
            - readonly_lookup
          inherits: base
          fields:
            - name:
                type: string
                size: 128
            - description:
                type: string
                size: unlimited
                default_value: ""
      - contact_base:
          tags:
            - datasource_type
          inherits: base
          fields:
            - name:
                type: string
                size: 512
            - given_name:
                type: string
                size: 512
            - additional_name:
                type: string
                size: 512
                default_value: ""
            - pronunciation:
                type: string
                size: 512
                default_value: ""
            - family_name:
                type: string
                size: 512
                default_value: ""
            - nick_name:
                type: string
                size: 512
                default_value: ""
            - job_title:
                type: string
                size: 512
                default_value: ""
            - gender_type_id:
                references: gender.id
            - organization:
                type: string
                size: 512
                default_value: ""
            - is_starred:
                type: boolean
                default_value: false
            - is_favorite:
                type: boolean
                default_value: false
            - is_deleted:
                type: boolean
                default_value: false
      - email_type:
          tags:
            - datasource_type
            - readonly_lookup
          inherits: base
          fields:
            - name:
                type: string
                size: 128
            - description:
                type: string
                size: unlimited
                default_value: ""
      - email_base:
          tags:
            - datasource_type
          inherits: base
          fields:
            - email_type_id:
                references: email_type.id
            - contact_id:
                references: contact_base.id
            - address:
                type: string
                size: 320
                is_unique: true
            - display_name:
                type: string
                size: 256
                default_value: ""
            - is_primary:
                type: boolean
      - phone_type:
          tags:
            - datasource_type
            - readonly_lookup
          inherits: base
          fields:
            - name:
                type: string
                size: 128
            - description:
                type: string
                size: unlimited
                default_value: ""
      - phone_base:
          tags:
            - datasource_type
          inherits: base
          fields:
            - phone_type_id:
                references: phone_type.id
            - contact_id:
                references: contact_base.id
            - number:
                type: string
                size: 20
                is_unique: true
            - display_name:
                type: string
                size: 256
            - extention:
                type: string
                size: 10
            - is_primary:
                type: boolean
            - is_verified:
                type: boolean
                default_value: false
      - address_type:
          tags:
            - datasource_type
            - readonly_lookup
          inherits: base
          fields:
            - name:
                type: string
                size: 128
            - description:
                type: string
                size: unlimited
                default_value: ""
      - address_base:
          tags:
            - datasource_type
          inherits: base
          fields:
            - contact_id:
                references: contact_base.id
            - address_type_id:
                references: address_type.id
            - display_name:
                type: string
                size: 255
                default_value: ""
            - line_1:
                type: string
                size: 255
            - line_2:
                type: string
                size: 255
                default_value: ""
            - line_3:
                type: string
                size: 255
                default_value: ""
            - neighborhood:
                type: string
                size: 100
                default_value: ""
            - district:
                type: string
                size: 100
                default_value: ""
            - city:
                type: string
                size: 100
            - state_province:
                type: string
                size: 100
                default_value: ""
            - postal_code:
                type: string
                size: 20
                default_value: ""
            - country_code:
                type: string
                size: 2
            - formatted_address:
                type: string
                size: unlimited
                default_value: ""
            - latitude:
                type: decimal
                size:
                  - 10
                  - 7
                is_nullable: true
            - longitude:
                type: decimal
                size:
                  - 10
                  - 7
                is_nullable: true
            - is_primary:
                type: boolean
                default_value: false
      - contact_attribute:
          tags:
            - datasource_type
          inherits: base
          fields:
            - contact_id:
                references: contact_base.id
            - name:
                type: string
                size: 255
            - value:
                type: string
                size: unlimited
      - contact_attribute_map:
          tags:
            - view_type
          inherits: dictionary
          fields:
            - key:
                type: string
                size: 255
                references: contact_attribute.name
            - value:
                type: string
                size: unlimited
                references: contact_attribute.value
      - address_attribute:
          tags:
            - datasource_type
          inherits: base
          fields:
            - address_id:
                references: address_base.id
            - name:
                type: string
                size: 255
            - value:
                type: string
                size: unlimited
      - address_attribute_map:
          tags:
            - view_type
          inherits: dictionary
          fields:
            - key:
                type: string
                size: 255
                references: address_attribute.name
            - value:
                type: string
                size: unlimited
                references: address_attribute.value
      - email_attribute:
          tags:
            - datasource_type
          inherits: base
          fields:
            - email_id:
                references: email_base.id
            - name:
                type: string
                size: 255
            - value:
                type: string
                size: unlimited
      - email_attribute_map:
          tags:
            - view_type
          inherits: dictionary
          fields:
            - key:
                type: string
                size: 255
                references: email_attribute.name
            - value:
                type: string
                size: unlimited
                references: email_attribute.value
      - phone_attribute:
          tags:
            - datasource_type
          inherits: base
          fields:
            - phone_id:
                references: phone_base.id
            - name:
                type: string
                size: 255
            - value:
                type: string
                size: unlimited
      - phone_attribute_map:
          tags:
            - view_type
          inherits: dictionary
          fields:
            - key:
                type: string
                size: 255
                references: phone_attribute.name
            - value:
                type: string
                size: unlimited
                references: phone_attribute.value
      - label:
          tags:
            - datasource_type
          inherits: base
          fields:
            - name:
                type: string
                size: 255
            - description:
                type: string
                size: unlimited
                default_value: ""
      - contact_label:
          tags:
            - datasource_type
            - many_to_many
          inherits: base
          fields:
            - contact_id:
                references: contact_base.id
            - label_id:
                references: label.id
      - address_label:
          tags:
            - datasource_type
            - many_to_many
          inherits: base
          fields:
            - address_id:
                references: address_base.id
            - label_id:
                references: label.id
      - email_label:
          tags:
            - datasource_type
            - many_to_many
          inherits: base
          fields:
            - email_id:
                references: email_base.id
            - label_id:
                references: label.id
      - phone_label:
          tags:
            - datasource_type
            - many_to_many
          inherits: base
          fields:
            - phone_id:
                references: phone_base.id
            - label_id:
                references: label.id
      - address:
          tags:
            - view_type
          inherits: address_base
          union:
            - address_type
          extract:
            - address_type.name
            - address_type.description
          mapping:
            name: address_type_name
          fields:
            - attributes:
                type: address_attribute_map{}
                references: address_attribute.address_id
            - labels:
                type: label[]
                references: address_label.address_id
      - email:
          tags:
            - view_type
          inherits: email_base
          union:
            - email_type
          extract:
            - email_type.name
            - email_type.description
          mapping:
            name: email_type_name
          fields:
            - attributes:
                type: email_attribute_map{}
                references: email_attribute.email_id
            - labels:
                type: label[]
                references: email_label.email_id
      - phone:
          tags:
            - view_type
          inherits: phone_base
          union:
            - phone_type
          extract:
            - phone_type.name
            - phone_type.description
          mapping:
            name: phone_type_name
          fields:
            - attributes:
                type: phone_attribute_map{}
                references: phone_attribute.phone_id
            - labels:
                type: label[]
                references: phone_label.phone_id
      - contact:
          tags:
            - view_type
          inherits: contact_base
          fields:
            - addresses:
                type: address[]
                references: address.contact_id
            - emails:
                type: email[]
                references: email.contact_id
            - phones:
                type: phone[]
                references: phone.contact_id
            - attributes:
                type: contact_attribute_map{}
                references: contact_attribute.contact_id
            - labels:
                type: label[]
                references: contact_label.contact_id
datasource.sqlite.yaml:
  added: true
  content:
    version: 1.0.0
    includes:
      - types:
          filter: tag == "datasource_type"
    types:
      - base:
          fields:
            - id:
                include_in_create: false
                include_in_update: false
            - uuid:
                include_in_create: true
            - created:
                include_in_create: true
            - updated:
                include_in_create: false
                include_in_update: false
            - version:
                include_in_create: true
      - user_base:
          mapping: users
      - user_setting:
          indexes:
            - user_setting_user_id_name:
                fields:
                  - user_id
                  - name
                is_unique: true
      - game_parent_setting:

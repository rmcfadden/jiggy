puzzles.yaml:
  added: true
  content: null
settings.yaml:
  added: true
  content:
    settings:
      backend:
        datasources: sqlite,mysql,postgres
      languages:
        typescript:
          casing:
            fields: camel
types.yaml:
  added: true
  content:
    version: 1.0.0
    includes:
      - file: base.yaml
      - file: user-roles.yaml
        combine_options:
          source:
            remove_types:
              - base
      - file: contacts.yaml
        combine_options:
          source:
            remove_types:
              - base
            add_fields:
              - type: contact_base
                add_field:
                  user_id:
                    references: user_base.id
      - file: cms.yaml
        combine_options:
          source:
            remove_types:
              - base
    types:
      - category:
          tags:
            - datasource_type
            - view_type
          inherits: base
          fields:
            - category_id:
                references: category.id
                is_nullable: true
            - name:
                type: string
                size: 128
            - description:
                type: string
                size: unlimited
            - is_enabled:
                type: boolean
                default_value: true
            - is_deleted:
                type: boolean
                default_value: false
      - game_parent_base:
          tags:
            - datasource_type
          inherits: base
          fields:
            - name:
                type: string
                size: 128
            - description:
                type: string
                size: unlimited
            - location:
                type: string
                size: 256
            - is_enabled:
                type: boolean
                default_value: true
            - is_deleted:
                type: boolean
                default_value: false
      - game_parent_config:
          tags:
            - datasource_type
          inherits: base
          fields:
            - game_parent_id:
                references: game_parent_base.id
            - name:
                type: string
                size: 128
            - value:
                type: string
                size: unlimited
      - game_base:
          tags:
            - datasource_type
          inherits: base
          fields:
            - name:
                type: string
                size: 128
            - description:
                type: string
                size: unlimited
            - game_parent_id:
                references: game_parent_base.id
            - game_parent_config_id:
                references: game_parent_config.id
            - is_deleted:
                type: boolean
                default_value: false
            - is_enabled:
                type: boolean
                default_value: true
      - game_category:
          tags:
            - datasource_type
            - many_to_many
          inherits: base
          fields:
            - game_id:
                references: game_base.id
            - category_id:
                references: category.id
      - game_parent_category:
          tags:
            - datasource_type
            - many_to_many
          inherits: base
          fields:
            - game_parent_id:
                references: game_parent_base.id
            - category_id:
                references: category.id
      - game_state:
          tags:
            - datasource_type
          inherits: base
          fields:
            - game_id:
                references: game_base.id
            - user_id:
                references: user_base.id
            - state:
                type: string
                size: 256
      - game_parent_setting:
          tags:
            - datasource_type
          inherits: base
          fields:
            - game_parent_id:
                references: game_parent_base.id
            - name:
                type: string
                size: 128
            - value:
                type: string
                size: unlimited
      - game_parent_setting_map:
          tags:
            - view_type
          inherits: dictionary
          fields:
            - key:
                type: string
                size: 128
                references: game_parent_setting.name
            - value:
                type: string
                size: unlimited
                references: game_parent_setting.value
      - game_setting:
          tags:
            - datasource_type
          inherits: base
          fields:
            - game_id:
                references: game_base.id
            - name:
                type: string
                size: 128
            - value:
                type: string
                size: unlimited
      - game_setting_map:
          tags:
            - view_type
          inherits: dictionary
          fields:
            - key:
                type: string
                size: 128
                references: game_setting.name
            - value:
                type: string
                size: unlimited
                references: game_setting.value
      - review:
          tags:
            - datasource_type
          inherits: base
          fields:
            - game_id:
                references: game_base.id
            - user_id:
                references: user_base.id
            - description:
                type: string
                size: unlimited
            - rating:
                type: decimal
                size:
                  - 10
                  - 2
            - is_approved:
                type: boolean
                default_value: false
      - game:
          tags:
            - view_type
          inherits: game_base
          fields:
            - settings:
                type: game_setting_map{}
                references: game_setting.game_id
            - categories:
                type: category[]
                references: game_category.game_id
      - game_parent:
          tags:
            - view_type
          inherits: game_parent_base
          fields:
            - settings:
                type: game_parent_setting_map{}
                references: game_parent_setting.game_parent_id
            - categories:
                type: category[]
                references: game_parent_category.game_parent_id
user-roles.yaml:
  added: true
  content:
    version: 1.0.0
    includes:
      - file: base.yaml
    types:
      - user_base:
          tags:
            - datasource_type
          inherits: base
          fields:
            - username:
                type: string
            - is_enabled:
                type: boolean
                default_value: true
      - role:
          tags:
            - datasource_type
          inherits: base
          fields:
            - name:
                type: string
            - description:
                type: string
                default_value: ""
            - is_enabled:
                type: boolean
                default_value: true
      - group:
          tags:
            - datasource_type
          inherits: base
          fields:
            - name:
                type: string
            - description:
                type: string
                default_value: ""
            - is_enabled:
                type: boolean
                default_value: true
      - user_group:
          tags:
            - datasource_type
            - many_to_many
          inherits: base
          fields:
            - user_id:
                references: user_base.id
            - group_id:
                references: group.id
      - user_role:
          tags:
            - datasource_type
            - many_to_many
          inherits: base
          fields:
            - user_id:
                references: user_base.id
            - role_id:
                references: role.id
      - user_setting:
          tags:
            - datasource_type
          inherits: base
          fields:
            - user_id:
                references: user_base.id
            - name:
                type: string
                size: 128
            - value:
                type: string
                size: unlimited
      - user_setting_map:
          tags:
            - view_type
          inherits: dictionary
          fields:
            - key:
                type: string
                size: 128
                references: user_setting.name
            - value:
                type: string
                size: unlimited
                references: user_setting.value
      - user:
          tags:
            - view_type
          inherits: user_base
          fields:
            - settings:
                type: user_setting_map{}
                references: user_setting.user_id
            - roles:
                type: role[]
                references: user_role.user_id
            - groups:
                type: group[]
                references: user_group.user_id

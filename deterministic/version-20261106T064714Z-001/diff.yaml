datasource_seeds.yaml:
  added: true
  content:
    version: 1.0.0
    seeds:
      - gender:
          - id1:
              name: Male
              description: Male
          - id2:
              name: Female
              description: Female
          - id3:
              name: Other
              description: Other
          - id4:
              name: Agender
              description: A person who does not identify themselves with or experience any
                gender. Also called null-gender, genderless, gendervoid, or
                neutral gender.
          - id5:
              name: Abimegender
              description: Associated with being profound, deep, and infinite. May be used
                alone or in combination with other genders.
          - id6:
              name: Adamas gender
              description: A gender that is indefinable or indomitable. People identifying
                with this gender refuse to be categorized in any particular
                gender identity.
          - id7:
              name: Aerogender
              description: Also called evaisgender, this gender identity changes according to
                one's surroundings.
          - id8:
              name: Aesthetigender
              description: Also called aesthetgender, a type of gender identity derived from
                aesthetics.
          - id9:
              name: Affectugender
              description: Based on the person's mood swings or fluctuations.
          - id10:
              name: Agenderflux
              description: Mostly agender with brief shifts of belonging to other gender
                types.
          - id11:
              name: Alexigender
              description: A fluid gender identity between more than one type of gender
                although the person cannot name the genders they feel fluid in.
          - id12:
              name: Aliusgender
              description: Stands apart from existing social gender constructs. A strong
                specific gender identity that is neither male nor female.
          - id13:
              name: Amaregender
              description: A gender identity that changes depending on the person one is
                emotionally attached to.
          - id14:
              name: Ambigender
              description: Two specific gender identities simultaneously without any fluidity
                or fluctuations.
          - id15:
              name: Ambonec
              description: The person identifies as both man and woman and yet does not belong
                to either.
          - id16:
              name: Amicagender
              description: A gender-fluid identity where a person changes their gender
                depending on the friends they have.
          - id17:
              name: Androgyne
              description: A combination of feminine and masculine genders.
          - id18:
              name: Anesigender
              description: Feeling close to a specific type of gender despite being more
                comfortable identifying with another gender.
          - id19:
              name: Angenital
              description: Desiring to be without any primary sexual characteristics without
                identifying as genderless.
          - id20:
              name: Anogender
              description: Gender identity fades in and out in intensity but always comes back
                to the same gendered feeling.
          - id21:
              name: Anongender
              description: Having a gender identity but not labeling it or preferring not to
                have a label.
          - id22:
              name: Antegender
              description: A protean gender that can be anything but is formless and
                motionless.
          - id23:
              name: Anxiegender
              description: A gender identity with anxiety as its prominent characteristic.
          - id24:
              name: Apagender
              description: Apathy or a lack of feelings toward one's gender identity.
          - id25:
              name: Apconsugender
              description: Knowing what are not the characteristics of gender but not knowing
                what are its characteristics.
          - id26:
              name: Astergender
              description: A bright and celestial gender identity.
          - id27:
              name: Astral gender
              description: A gender identity that feels related to space.
          - id28:
              name: Autigender
              description: A gender identity that feels closely related to being autistic.
          - id29:
              name: Autogender
              description: A gender experience that is deeply connected and personal to
                oneself.
          - id30:
              name: Axigender
              description: Between the two extremes of agender and any other type of gender,
                experienced one at a time without overlapping.
          - id31:
              name: Bigender
              description: Two gender identities at the same or different times.
          - id32:
              name: Biogender
              description: A gender closely related to nature.
          - id33:
              name: Blurgender
              description: More than one gender identity that blur into each other so no
                particular type is clear. Also called gender fuss.
          - id34:
              name: Boyflux
              description: Identifies as male but experiences varying degrees of male
                identity, ranging from agender to completely male.
          - id35:
              name: Burstgender
              description: Frequent bursts of intense feelings quickly move to the initial
                calm stage.
          - id36:
              name: Caelgender
              description: Shares the qualities or aesthetics of outer space.
          - id37:
              name: Cassgender
              description: Associated with considering gender irrelevant or unimportant.
          - id38:
              name: Cassflux
              description: A fluctuating intensity of irrelevance toward gender.
          - id39:
              name: Cavusgender
              description: Feeling close to one gender when depressed and to another when not
                depressed.
          - id40:
              name: Cendgender
              description: Gender identity changes from one gender to its opposite.
          - id41:
              name: Ceterogender
              description: A nonbinary gender with specific masculine, feminine, or neutral
                feelings.
          - id42:
              name: Ceterofluid
              description: A ceterogender whose identity keeps fluctuating between different
                genders.
          - id43:
              name: Cisgender
              description: Closely related to the gender assigned at birth during the entire
                life.
          - id44:
              name: Cloudgender
              description: Gender cannot be comprehended due to depersonalization and
                derealization disorder.
          - id45:
              name: Collgender
              description: Various genders present at the same time.
          - id46:
              name: Colorgender
              description: Colors are used to describe gender, e.g., pink gender or black
                gender.
          - id47:
              name: Commogender
              description: Knows they are not cisgender yet continues to identify as one for a
                while.
          - id48:
              name: Condigender
              description: Feels their gender only under specific circumstances.
          - id49:
              name: Deliciagender
              description: Having multiple genders but preferring one over the other.
          - id50:
              name: Demifluid
              description: Multiple genders, some fluid while others are static.
          - id51:
              name: Demiflux
              description: Multiple genders with some static and others fluctuating in
                intensity.
          - id52:
              name: Demigender
              description: Partial traits of one gender and the rest of the other gender.
          - id53:
              name: Domgender
              description: Multiple genders with one dominating over the rest.
          - id54:
              name: Duragender
              description: More than one gender with one lasting longer than the others.
          - id55:
              name: Egogender
              description: A personal type of gender identified by the individual alone, based
                on experience within the self.
          - id56:
              name: Epicene
              description: A strong feeling of not being able to relate to any or both of the
                binary gender characteristics.
          - id57:
              name: Esspigender
              description: Gender identity related to spirits.
          - id58:
              name: Exgender
              description: Denial to identify with any gender on the gender spectrum.
          - id59:
              name: Existigender
              description: Gender identity exists only when the person makes conscious efforts
                to realize it.
          - id60:
              name: Femfluid
              description: Fluid or fluctuating regarding the feminine genders.
          - id61:
              name: Femgender
              description: A nonbinary gender identity that is feminine.
          - id62:
              name: Fluidflux
              description: Fluid between two or more genders with fluctuation in intensity of
                those genders.
          - id63:
              name: Gemigender
              description: Two genders that are opposite yet flux and work together.
          - id64:
              name: Genderblank
              description: Closely related to a blank space.
          - id65:
              name: Genderflow
              description: Gender identity is fluid between infinite feelings.
          - id66:
              name: Genderfluid
              description: Does not consistently adhere to one fixed gender and may have many
                genders.
          - id67:
              name: Genderfuzz
              description: More than one gender is blurred together.
          - id68:
              name: Genderflux
              description: Gender fluctuates in intensity.
          - id69:
              name: Genderpuck
              description: Resists fitting in societal norms concerning genders.
          - id70:
              name: Genderqueer
              description: Blurs the preconceived boundaries of gender in relation to the
                gender binary or having just one gender type.
          - id71:
              name: Gender witched
              description: Inclined toward having one gender but does not know which.
          - id72:
              name: Girlflux
              description: Identifies as female but with varying intensities of female
                identity.
          - id73:
              name: Healgender
              description: A gender identity that gives the person peace, calm, and
                positivity.
          - id74:
              name: Mirrorgender
              description: Changing one's gender type based on the people surrounding.
          - id75:
              name: Omnigender
              description: Having or experiencing all genders.

            - contact_attribute_contact_id_index:
                fields:
                  - contact_id
                is_unique: false
      - address_attribute:
          indexes:
            - address_attribute_address_id_index:
                fields:
                  - address_id
                is_unique: false
      - contact_label:
          indexes:
            - contact_label_contact_id_label_id:
                fields:
                  - contact_id
                  - label_id
                is_unique: true
            - contact_label_label_id_index:
                fields:
                  - label_id
                is_unique: false
      - address_label:
          indexes:
            - address_label_address_id_label_id:
                fields:
                  - address_id
                  - label_id
                is_unique: true
      - email_label:
          indexes:
            - email_label_email_id_label_id:
                fields:

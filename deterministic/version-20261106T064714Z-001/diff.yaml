                  - game_id
                  - name
                is_unique: true
      - game_base:
          mapping: games
      - game_category:
          indexes:
            - game_category_game_id_category_id:
                fields:
                  - game_id
                  - category_id
                is_unique: true
      - game_parent_category:
          indexes:
            - game_parent_category_game_parent_id_category_id:
                fields:
                  - game_parent_id
                  - category_id

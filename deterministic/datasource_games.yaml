version: 1.0.0
types:
  - game_parent_setting:
      indexes:
        - game_parent_setting_game_parent_id_name:
            fields: [game_parent_id, name]
            is_unique: true
  - game_setting:
      indexes:
        - game_setting_game_id_name:
            fields: [game_id, name]
            is_unique: true
  - game_base:
      mapping: games
  - game_attribute:
      indexes:
        - game_attribute_game_id_name:
            fields: [game_id, name]
            is_unique: true
  - game_parent_base:
      mapping: game_parent
  - game_play_base:
      mapping: game_play
  - game_play_users:
      indexes:
        - game_play_users_game_play_id_user_id:
            fields: [game_play_id, user_id]
            is_unique: true
  - game_play_state:
      indexes:
        - game_play_state_game_play_id:
            fields: [game_play_id]
            is_unique: false
  - game_play_action:
      indexes:
        - game_play_action_game_play_id:
            fields: [game_play_id]
            is_unique: false
  - localized_string_base:
      mapping: localized_string
  - resource_base:
      mapping: resource
  - game_category:
      indexes:
        - game_category_game_id_category_id:
            fields: [game_id, category_id]
            is_unique: true
  - game_parent_category:
      indexes:
        - game_parent_category_game_parent_id_category_id:
            fields: [game_parent_id, category_id]
            is_unique: true

version: 1.0.0
includes:
  - file: base.yaml
types:
  - user_base:
      tags:
        - datasource_type
      inherits: base
      fields:
        - username:
            type: string
        - is_enabled:
            type: boolean
            default_value: true
  - role:
      tags:
        - datasource_type
      inherits: base
      fields:
        - name:
            type: string
        - description:
            type: string
            default_value: ""
        - is_enabled:
            type: boolean
            default_value: true

  - permission:
      tags:
        - datasource_type
      inherits: base
      fields:
        - name:
            type: string
        - description:
            type: string
            default_value: ""
        - is_enabled:
            type: boolean
            default_value: true
        - is_deleted:
            type: boolean
            default_value: false

  - group:
      tags:
        - datasource_type
      inherits: base
      fields:
        - name:
            type: string
        - description:
            type: string
            default_value: ""
        - is_enabled:
            type: boolean
            default_value: true
        - is_deleted:
            type: boolean
            default_value: false

  - user_group:
      tags:
        - datasource_type
        - many_to_many
      inherits: base
      fields:
        - user_id:
            references: user_base.id
        - group_id:
            references: group.id
  - user_role:
      tags:
        - datasource_type
        - many_to_many
      inherits: base
      fields:
        - user_id:
            references: user_base.id
        - role_id:
            references: role.id

  - user_setting:
      tags:
        - datasource_type
      inherits: base
      fields:
        - user_id:
            references: user_base.id
        - name:
            type: string
            size: 128
        - value:
            type: string
            size: unlimited

  - user_permission:
      tags:
        - datasource_type
        - many_to_many
      inherits: base
      fields:
        - user_id:
            references: user_base.id
        - permission_id:
            references: permission.id

  - role_permission:
      tags:
        - datasource_type
        - many_to_many
      inherits: base
      fields:
        - permission_id:
            references: permission.id
        - role_id:
            references: role_base.id

  - user_setting_map:
      tags:
        - view_type
      inherits: dictionary
      fields:
        - key:
            type: string
            size: 128
            references: user_setting.name
        - value:
            type: string
            size: unlimited
            references: user_setting.value
  - user:
      tags:
        - view_type
      inherits: user_base
      fields:
        - settings:
            type: user_setting_map{}
            references: user_setting.user_id
        - roles:
            type: role[]
            references: user_role.user_id
        - groups:
            type: group[]
            references: user_group.user_id

version: 1.0.0
includes:
  - file: games.yaml
  - file: identity.yaml
    combine_options:
      source:
        remove_types: [base, user_base, role, group, user_group, user_role, user_setting, user_setting_map, user]
  - file: sessions.yaml
types:
  - game_summary:
      tags: [view_type, readonly]
      fields:
        - id:
            # the game's id
            type: biginteger
            is_id: true
        - name:
            type: string
            size: 128
        - description:
            type: string
            size: unlimited
        - parent_name:
            type: string
            size: 128
        - thumbname_location:
            type: string
            size: 128
        - categories:
            type: category[]
            references: game_category.game_id
        - attributes:
            type: game_attribute_map{}
            references: game_attribute.game_id

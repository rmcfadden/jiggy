version: 1.0.0
includes:
  - file: base.yaml
  - file: user-roles.yaml
    combine_options:
      source:
        remove_types: [base]
  - file: contacts.yaml
    combine_options:
      source:
        remove_types: [base]
        add_fields:
          - type: contact_base
            add_field:
              user_id:
                references: user.id
        modify_fields:
          - field: contact_change_log.contact_id
            def:
              type: biginteger
types:
  - category:
      tags: [datasource_type, view_type]
      inherits: base
      fields:
        - category_id:
            # null is a root category
            references: category.id
            is_nullable: true
        - name:
            type: string
            size: 128
        - description:
            type: string
            size: unlimited
        - is_enabled:
            type: boolean
            default_value: true
        - is_deleted:
            type: boolean
            default_value: false
  - game_base:
      tags: [datasource_type]
      inherits: base
      fields:
        - name:
            type: string
            size: 128
        - description:
            type: string
            size: unlimited
        - location:
            type: string
            size: 256
        - is_enabled:
            type: boolean
            default_value: true
        - is_deleted:
            type: boolean
            default_value: false
  - game_category:
      tags: [datasource_type, many_to_many]
      inherits: base
      fields:
        - game_id:
            references: game_base.id
        - category_id:
            references: category.id
  - game_state:
      tags: [datasource_type]
      inherits: base
      fields:
        - game_id:
            references: game_base.id
        - user_id:
            references: user.id
        - state:
            type: string
            size: 256
  - game_setting:
      tags: [datasource_type]
      inherits: base
      fields:
        - game_id:
            references: game_base.id
        - name:
            type: string
            size: 128
        - value:
            type: string
            size: unlimited
  - game_setting_map:
      tags: [view_type]
      inherits: dictionary
      fields:
        - key:
            type: string
            size: 128
            references: game_setting.name
        - value:
            type: string
            size: unlimited
            references: game_setting.value
  - review:
      tags: [datasource_type]
      inherits: base
      fields:
        - game_id:
            references: game_base.id
        - user_id:
            references: user.id
        - description:
            type: string
            size: unlimited
        - rating:
            type: decimal
            size: [10, 2]
        - is_approved:
            type: boolean
            default_value: false
  - game:
      tags: [view_type]
      inherits: game_base
      fields:
        - settings:
            type: game_setting_map{}
            references: game_setting.game_id
        - categories:
            type: category[]
            references: game_category.game_id

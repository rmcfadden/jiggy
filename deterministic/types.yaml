version: 1.0.0
includes:
  - file: games.yaml
  - file: identity.yaml
    combine_options:
      source:
        remove_types: [base, user_base, role, group, user_group, user_role, user_setting, user_setting_map, user]
  - file: sessions.yaml
  - file: accounts_ledger.yaml
    combine_options:
      source:
        remove_types: [base, user_base, role, group, user_group, user_role, user_setting, user_setting_map, user]
types:

  - setting:
      tags:
        - datasource_type
      inherits: base
      fields:
        - name:
            type: string
            size: 255
        - value:
            type: string
            size: unlimited

  - settings_map:
      tags:
        - view_type
      inherits: dictionary
      fields:
        - key:
            type: string
            size: 255
            references: setting.name
        - value:
            type: string
            size: unlimited
            references: setting.value

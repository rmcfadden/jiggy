version: 1.0.0
includes:
  - file: games.yaml
  - file: identity.yaml
    combine_options:
      source:
        remove_types: [base, user_base, role, group, user_group, user_role, user_setting, user_setting_map, user]
  - file: sessions.yaml
types:

  - setting:
      tags:
        - datasource_type
      inherits: base
      fields:
        - app_id:
            references: app_base.id
        - name:
            type: string
            size: 255
        - value:
            type: string
            size: unlimited

  - app_base:
      # host row that owns the app-wide settings dictionary
      tags:
        - datasource_type
      inherits: base
      fields:
        - name:
            type: string
            size: 128

  - settings_map:
      tags:
        - view_type
      inherits: dictionary
      fields:
        - key:
            type: string
            size: 255
            references: setting.name
        - value:
            type: string
            size: unlimited
            references: setting.value

  - app:
      tags:
        - view_type
      inherits: app_base
      fields:
        - settings:
            type: settings_map{}
            references: setting.app_id
